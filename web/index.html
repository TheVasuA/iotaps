<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoTAPS — IoT Automation Platform Services</title>
    <meta
      name="description"
      content="IoT Automation Platform Services — MQTT device provisioning, live dashboards, rule chains, and billing for teams shipping connected products."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Open Graph / Twitter defaults. Per-route values are applied by
         web/src/lib/usePageMeta.js once the SPA hydrates.
         Image URLs must be absolute: share scrapers (Facebook, X, Slack,
         LinkedIn) fetch this raw HTML and never execute the SPA, so a
         root-relative path yields a missing preview image. -->
    <meta property="og:site_name" content="IoTAPS" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IoTAPS — IoT Automation Platform Services" />
    <meta
      property="og:description"
      content="IoT Automation Platform Services — MQTT device provisioning, live dashboards, rule chains, and billing for teams shipping connected products."
    />
    <meta property="og:image" content="https://iotaps.com/marketing/hero-console-preview.jpg" />
    <meta property="og:url" content="https://iotaps.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IoTAPS — IoT Automation Platform Services" />
    <meta
      name="twitter:description"
      content="IoT Automation Platform Services — MQTT device provisioning, live dashboards, rule chains, and billing for teams shipping connected products."
    />
    <meta name="twitter:image" content="https://iotaps.com/marketing/hero-console-preview.jpg" />
    <link rel="canonical" href="https://iotaps.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
