<svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IoTaps black hole logo">
  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#12151C"/>
      <stop offset="100%" stop-color="#05060A"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="70%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#3B4252"/>
      <stop offset="50%" stop-color="#E8ECF5"/>
      <stop offset="100%" stop-color="#3B4252"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="360" height="360" rx="80" fill="url(#space)"/>
  <g fill="#C9D2E3">
    <circle cx="70" cy="70" r="1.4" opacity="0.7"/>
    <circle cx="300" cy="90" r="1.1" opacity="0.6"/>
    <circle cx="285" cy="270" r="1.3" opacity="0.7"/>
    <circle cx="60" cy="285" r="1" opacity="0.5"/>
    <circle cx="180" cy="40" r="1" opacity="0.5"/>
    <circle cx="325" cy="180" r="1.2" opacity="0.6"/>
  </g>
  <g transform="translate(180,180) rotate(-24)">
    <ellipse cx="0" cy="0" rx="118" ry="42" fill="none" stroke="#AEB8CC" stroke-width="20" opacity="0.15" filter="url(#softglow)"/>
    <ellipse cx="0" cy="0" rx="112" ry="38" fill="none" stroke="url(#disk)" stroke-width="9" filter="url(#glow)"/>
    <ellipse cx="0" cy="0" rx="86" ry="28" fill="none" stroke="#EEF2FA" stroke-width="2.5" opacity="0.8"/>
  </g>
  <circle cx="180" cy="180" r="62" fill="url(#core)"/>
  <circle cx="180" cy="180" r="62" fill="none" stroke="#DCE3F0" stroke-width="2.5" opacity="0.85" filter="url(#glow)"/>
  <g fill="#F5F8FF" filter="url(#glow)">
    <circle cx="180" cy="150" r="10"/>
    <rect x="172" y="168" width="16" height="46" rx="8"/>
  </g>
  <g transform="translate(180,180) rotate(-24)">
    <circle cx="112" cy="0" r="7" fill="#FFFFFF" filter="url(#glow)"/>
  </g>
</svg>
