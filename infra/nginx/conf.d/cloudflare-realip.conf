# Real-client-IP restoration (Req 32.4, supports Req 29.3 IP blocking)
#
# Whatever fronts this container — a Cloudflare edge node, a host-level nginx,
# or nothing — the TCP peer Nginx sees may be a proxy rather than the visitor.
# Without restoration every request appears to come from that proxy, and the
# platform's per-IP login-attempt blocking (Req 29.3) blocks the proxy instead
# of the offending client.
#
# `set_real_ip_from` lists the hops we trust; the `real_ip_header` /
# `real_ip_recursive` pair at the bottom rewrites $remote_addr to the original
# visitor. Refresh the Cloudflare ranges from https://www.cloudflare.com/ips/.

# Cloudflare IPv4 ranges
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6 ranges
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# ---------------------------------------------------------------------------
# Local reverse-proxy hop
# ---------------------------------------------------------------------------
# This container can sit behind a host-level nginx (shared VPS: the host owns
# :80/:443 and proxies to 127.0.0.1:8088). That hop's peer address is the Docker
# bridge gateway, which matches none of the Cloudflare ranges above — so without
# trusting it, $remote_addr is the gateway for EVERY request and the per-IP token
# bucket / login-attempt blocking (Req 29.3) collapses into a single shared
# bucket that throttles all users at once.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# X-Forwarded-For rather than CF-Connecting-IP, because it is the one header
# present across every supported topology (direct, host-nginx, Cloudflare).
# Each hop APPENDS its own peer, and real_ip_recursive walks the list
# right-to-left skipping trusted addresses, so the last untrusted entry wins.
# A client that pre-seeds a bogus X-Forwarded-For only pollutes the far-left of
# the chain and cannot displace the true peer appended by the first proxy.
#
# NOTE: if you orange-cloud the domain, add the Cloudflare ranges above plus
# `real_ip_header CF-Connecting-IP` to the HOST nginx too, so the client IP it
# forwards to this container is the visitor and not a Cloudflare edge node.
real_ip_header X-Forwarded-For;
real_ip_recursive on;
