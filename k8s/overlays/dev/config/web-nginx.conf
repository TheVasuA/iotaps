# Nginx config for the SPA pod.
#
# The web image deliberately bakes in no config -- docker-compose.yml mounts
# infra/nginx/* instead -- so the image falls back to nginx's stock default,
# which has no SPA rewrite. Without the try_files below, a deep link such as
# /dashboard/42 or a browser refresh on any client-side route returns 404.
#
# This is only the static-serving half of infra/nginx/conf.d/iotaps.conf. The
# /api and /ws proxying lives in the Ingress objects, so it is deliberately
# absent here: the SPA is reached through the same host, which is what the build
# assumes (web/.env.production leaves VITE_API_BASE_URL relative at /api/v1 and
# lets realtime.js derive wss://<current-host>/ws).

server {
    listen 8080;
    server_name _;

    # Emit relative Location headers. Without this nginx builds absolute
    # redirects from `listen`, so asking for a prerendered route bounces the
    # visitor to http://<host>:8080/faq/ -- wrong scheme (TLS terminates at the
    # Ingress) and the container's own port.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames under /assets, so they can be cached
    # indefinitely and safely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entry point, or a deploy would not take effect until
    # browsers happened to revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Liveness/readiness target that does not depend on the SPA bundle.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Static files first, then a prerendered route directory's index.html, then
    # the SPA fallback. `$uri/index.html` rather than `$uri/` so a request for
    # /faq serves dist/faq/index.html directly instead of bouncing through
    # nginx's directory-slash redirect; the trailing-slash form /faq/ still
    # resolves because the kernel collapses the doubled slash in /faq//index.html.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/index.html /index.html;
    }
}
