# Frontend SPA, served in-cluster.
#
# This lives in the dev overlay rather than in base on purpose. Per DEPLOY.md the
# production frontend is built and hosted by Cloudflare Pages, so `base` routes
# only /api and /ws and has no web tier. For a self-contained dev environment it
# is more useful to serve the SPA from the same host, which is also what the
# bundle expects: web/.env.production leaves VITE_API_BASE_URL relative
# (/api/v1) and realtime.js derives wss://<current-host>/ws, so same-origin
# hosting means no CORS and no second hostname.
#
# To host the frontend in-cluster in production too, move this file and
# config/web-nginx.conf into base, add the `/` Ingress path there, and drop the
# Cloudflare Pages step.
#
# Build and load the image (it is separate from iotaps/api):
#   docker build -t iotaps/web:dev ./web
#   docker save iotaps/web:dev | microk8s images import
---
apiVersion: v1
kind: Service
metadata:
  name: iotaps-web
  labels:
    app.kubernetes.io/name: iotaps
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: iotaps
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iotaps
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iotaps-web
  labels:
    app.kubernetes.io/name: iotaps
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: iotaps
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: iotaps
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iotaps
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: iotaps
    spec:
      securityContext:
        # nginx:alpine's unprivileged-capable layout: uid 101 is `nginx`. The
        # listener is on 8080 rather than 80 because a non-root process cannot
        # bind a privileged port.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: iotaps/web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: web-nginx.conf
              readOnly: true
            # nginx writes its pid and proxy/fastcgi scratch files under /var;
            # the root filesystem is read-only, so these need tmpfs mounts.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: iotaps-web-nginx
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 8Mi
