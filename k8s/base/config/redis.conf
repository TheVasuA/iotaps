# IoTAPS Redis configuration.
#
# requirepass is NOT set here -- it is appended on the command line from the
# REDIS_PASSWORD secret, because Redis config files cannot interpolate env vars.

# AOF persistence: the ingest queue and rate-limit counters survive a restart.
appendonly yes
appendfsync everysec
dir /data

# A hard memory cap plus LRU eviction. Do not switch this to `noeviction`:
# without a cap Redis grows until the OOM killer takes it down (the documented
# root cause of a previous multi-day outage), and `noeviction` would instead
# start refusing writes and break telemetry ingest.
# Keep this comfortably below the container memory limit.
maxmemory 512mb
maxmemory-policy allkeys-lru

# Drop half-open connections from pods that vanished.
tcp-keepalive 300

# Bind to all interfaces inside the pod network namespace; the ClusterIP
# Service plus the password are the access controls.
bind 0.0.0.0
protected-mode no
