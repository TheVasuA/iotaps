# IoTAPS Mosquitto configuration -- Kubernetes copy of infra/mosquitto/mosquitto.conf.
# Tuned for ~10,000 concurrent connections. Keep the two files in sync.
#
# SECURITY: allow_anonymous is true. Devices are identified by using their
# provisioning token as the MQTT client id, but the broker itself performs no
# authentication and enforces no per-org topic ACLs, so anyone who can reach
# port 1883 can publish to or subscribe from any topic. Only expose this broker
# publicly behind an allowlist, or wire up authentication first.
# See k8s/README.md ("Exposing MQTT").

persistence true
persistence_location /mosquitto/data/
log_dest stdout
# "all" floods the log at 10k connections; keep it to the actionable levels.
log_type error
log_type warning
log_type notice
connection_messages false

# MQTT listener - devices connect here
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# WebSocket listener - browser MQTT clients
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# ---------------------------------------------------------------------------
# Scale tuning (10,000+ concurrent connections)
# ---------------------------------------------------------------------------
# Unlimited connections, bounded only by file descriptors. The container command
# raises the soft nofile limit; see mosquitto.yaml.
max_connections -1

# Devices negotiate keepalive; the cap stops zombie connections lingering.
max_keepalive 120

# Per-client inflight QoS>0 messages (backpressure cap).
max_inflight_messages 100

# Queue for disconnected persistent-session clients (capped).
max_queued_messages 1000

# 256KB is generous for telemetry and prevents memory abuse.
message_size_limit 262144

# Drop offline persistent sessions after 7 days so queued messages do not
# accumulate on the persistence volume forever.
persistent_client_expiration 7d

# Broker stats to $SYS every 10s for monitoring.
sys_interval 10
