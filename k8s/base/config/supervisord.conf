; IoTAPS background worker supervision -- Kubernetes copy.
;
; Derived from infra/supervisor/supervisord.conf (the Compose version). Two
; differences, both required under Kubernetes:
;   1. pidfile/socket moved to /var/run/supervisor so the container can run with
;      a read-only root filesystem (an emptyDir is mounted at that path).
;   2. [unix_http_server] + [supervisorctl] + [rpcinterface] sections added so
;      the liveness probe can ask supervisord whether it is still responsive.
;      The Compose file omits them, which makes `supervisorctl` unusable.
;
; Keep the program list in sync with infra/supervisor/supervisord.conf.

[supervisord]
nodaemon=true
; Log to stdout so `kubectl logs` shows supervisord's own output. Individual
; programs already stream to /dev/stdout and /dev/stderr.
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisor/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

; The factory is an entry-point style reference: the separator before the
; callable is a COLON, not a dot. With a dot supervisord exits at startup with
; "make_main_rpcinterface cannot be resolved".
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ---------------------------------------------------------------------------
; Singleton workers -- exactly one replica of this Deployment may run.
; mqtt-listener subscribes across every org and batch-writer drains a shared
; Redis ingest queue; a second replica would double-ingest telemetry.
; ---------------------------------------------------------------------------

[program:mqtt-listener]
command=python -m app.workers.mqtt_listener
autostart=true
autorestart=true
startretries=1000000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

